name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.2.0; defaults to root package.json)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Publish as GitHub Pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as GitHub Draft Release (review and fill notes before final publish)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run: build, smoke-test, package, and aggregate artifacts without touching GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight & Version Verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check-ver.outputs.version }}
      tag_exists: ${{ steps.check-tag.outputs.tag_exists }}
      dry_run: ${{ steps.check-options.outputs.dry_run }}
      draft: ${{ steps.check-options.outputs.draft }}
      prerelease: ${{ steps.check-options.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cli/requirements-release.txt
          pip install pytest

      - name: Check version source of truth
        id: check-ver
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            INPUT_VER="${{ github.ref_name }}"
          fi
          INPUT_VER="${INPUT_VER#v}"
          
          if [ -n "$INPUT_VER" ] && [ "$INPUT_VER" != "$PKG_VER" ]; then
            echo "::error::Target version '$INPUT_VER' does not match root package.json version '$PKG_VER'"
            exit 1
          fi
          
          CLI_VER=$(python -c "from cli.core.version import get_version; print(get_version(strict=True))")
          if [ "$CLI_VER" != "$PKG_VER" ]; then
            echo "::error::CLI version '$CLI_VER' does not match root package.json '$PKG_VER'"
            exit 1
          fi
          
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "Resolved target version: v$PKG_VER"

      - name: Run preflight CLI tests and self-test
        run: |
          python -m compileall cli/ scripts/
          pytest -v cli/
          python cli/main.py --self-test

      - name: Register release options (dry_run, draft, prerelease)
        id: check-options
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # When triggered by pushing a tag, execute real release and create Draft release
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            [ -z "$DRY_RUN" ] && DRY_RUN="false"
            DRAFT="${{ github.event.inputs.draft }}"
            [ -z "$DRAFT" ] && DRAFT="true"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            [ -z "$PRERELEASE" ] && PRERELEASE="false"

            echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag and commit consistency
        id: check-tag
        run: |
          TARGET_VER="${{ steps.check-ver.outputs.version }}"
          TAG_NAME="v$TARGET_VER"
          CURRENT_COMMIT=$(git rev-parse HEAD)
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
            echo "Tag $TAG_NAME already exists pointing to commit $TAG_COMMIT"
            echo "Current target commit is $CURRENT_COMMIT"
            
            if [ "$TAG_COMMIT" != "$CURRENT_COMMIT" ]; then
              if [ "${{ steps.check-options.outputs.dry_run }}" = "true" ]; then
                echo "::warning::Tag $TAG_NAME points to commit $TAG_COMMIT which differs from current commit $CURRENT_COMMIT; dry run does not touch release assets, continuing."
                echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Tag $TAG_NAME already points to commit $TAG_COMMIT, which differs from current commit $CURRENT_COMMIT. Refusing to publish or overwrite."
                exit 1
              fi
            else
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            binary_name: PlaylistOut.exe
            asset_pattern: PlaylistOut-CLI-*-windows-x64.exe
          - target: linux-x64
            os: ubuntu-22.04
            binary_name: PlaylistOut
            asset_pattern: PlaylistOut-CLI-*-linux-x64.tar.gz
          - target: macos-arm64
            os: macos-14
            binary_name: PlaylistOut
            asset_pattern: PlaylistOut-CLI-*-macos-arm64.tar.gz
          - target: macos-x64
            os: macos-15-intel
            binary_name: PlaylistOut
            asset_pattern: PlaylistOut-CLI-*-macos-x64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install pinned release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cli/requirements-release.txt
          pip install pytest

      - name: Run pre-build unit tests on target runner
        run: |
          pytest -q cli/tests/

      - name: Build standalone executable via build-cli.py
        run: |
          python scripts/release/build-cli.py --target ${{ matrix.target }} --version ${{ needs.preflight.outputs.version }}

      - name: Smoke test staged binary (--version)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/cli/staging/PlaylistOut.exe --version
          else
            ./dist/cli/staging/PlaylistOut --version
          fi

      - name: Smoke test staged binary (--self-test)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/cli/staging/PlaylistOut.exe --self-test
          else
            ./dist/cli/staging/PlaylistOut --self-test
          fi

      - name: Smoke test staged binary (--help)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/cli/staging/PlaylistOut.exe --help
          else
            ./dist/cli/staging/PlaylistOut --help
          fi

      - name: Verify release asset created
        shell: bash
        run: |
          ls -lh dist/cli/artifacts/${{ matrix.asset_pattern }}

      - name: Upload target build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-build-${{ matrix.target }}
          path: dist/cli/artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release Aggregation & Publishing
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Create release staging directory
        run: mkdir -p dist/release-assets

      - name: Download all matrix build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/matrix-downloads

      - name: Consolidate and verify all platform assets
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          echo "Consolidating release assets for v$VERSION..."
          
          find dist/matrix-downloads -type f \( -name "PlaylistOut-CLI-v$VERSION-*.exe" -o -name "PlaylistOut-CLI-v$VERSION-*.tar.gz" \) -exec cp {} dist/release-assets/ \;
          
          cd dist/release-assets
          
          EXPECTED_ASSETS=(
            "PlaylistOut-CLI-v$VERSION-windows-x64.exe"
            "PlaylistOut-CLI-v$VERSION-linux-x64.tar.gz"
            "PlaylistOut-CLI-v$VERSION-macos-arm64.tar.gz"
            "PlaylistOut-CLI-v$VERSION-macos-x64.tar.gz"
          )
          
          for asset in "${EXPECTED_ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing expected release asset: $asset"
              exit 1
            fi
            echo "  ✔ Found: $asset ($(stat -c%s "$asset") bytes)"
          done

      - name: Generate CLI-SHA256SUMS.txt
        run: |
          cd dist/release-assets
          sha256sum PlaylistOut-CLI-v${{ needs.preflight.outputs.version }}-* > CLI-SHA256SUMS.txt
          cat CLI-SHA256SUMS.txt

      - name: Generate cli-release-manifest.json
        run: |
          python - << 'EOF'
          import hashlib
          import json
          import os
          from pathlib import Path
          
          assets_dir = Path("dist/release-assets")
          version = "${{ needs.preflight.outputs.version }}"
          commit = "${{ github.sha }}"
          
          assets = []
          for f in sorted(assets_dir.glob("PlaylistOut-CLI-*")):
              if f.is_file():
                  sha256 = hashlib.sha256(f.read_bytes()).hexdigest()
                  assets.append({
                      "name": f.name,
                      "size_bytes": f.stat().st_size,
                      "sha256": sha256
                  })
          
          manifest = {
              "project": "PlaylistOut",
              "version": version,
              "commit": commit,
              "python_version": "3.14.7",
              "pyinstaller_version": "6.22.3",
              "targets": ["windows-x64", "linux-x64", "macos-arm64", "macos-x64"],
              "assets": assets
          }
          
          out_file = assets_dir / "cli-release-manifest.json"
          out_file.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          EOF

      - name: Upload consolidated release bundle to Actions
        uses: actions/upload-artifact@v4
        with:
          name: playlistout-cli-release-v${{ needs.preflight.outputs.version }}
          path: dist/release-assets/*
          retention-days: 14

      - name: Publish to GitHub Release (Draft Release)
        if: needs.preflight.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          TAG_NAME="v$VERSION"
          
          DRAFT_FLAG=""
          if [ "${{ needs.preflight.outputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          
          PRERELEASE_FLAG=""
          if [ "${{ needs.preflight.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          cd dist/release-assets
          
          python - << 'EOF'
          import os
          from pathlib import Path
          import textwrap

          version = "${{ needs.preflight.outputs.version }}"
          tag = f"v{version}"

          notes = textwrap.dedent(f"""\
            # Playlist Out

            <!-- 在此处填入本次版本的中文介绍文字 / Enter Chinese highlights here -->

            <!-- 在此处填入本次版本的英文介绍文字 / Enter English highlights here -->

            ---

            ### 📦 包含全平台资产 / Assets Included

            - **Windows x64**: `PlaylistOut-CLI-{tag}-windows-x64.exe` (双击即用，内置终端常驻退出保护)
            - **Linux x64**: `PlaylistOut-CLI-{tag}-linux-x64.tar.gz` (独立可执行文件，解压后运行 `./PlaylistOut`)
            - **macOS Apple Silicon**: `PlaylistOut-CLI-{tag}-macos-arm64.tar.gz` (Apple 芯片原生构建，内附双击启动器)
            - **macOS Intel**: `PlaylistOut-CLI-{tag}-macos-x64.tar.gz` (Intel 芯片原生构建，内附双击启动器)
            - **SHA-256 校验和**: `CLI-SHA256SUMS.txt`

            ---

            **完整变更记录 / Full Changelog**：[CHANGELOG.md](https://github.com/LengxiQwQ/playlistout/blob/main/CHANGELOG.md)
          """)
          Path("release_notes.md").write_text(notes, encoding="utf-8")
          EOF
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG_NAME is already published. Refusing to upload CLI binaries to a published release (draft review is mandatory). Bump the version and cut a new draft release instead."
              exit 1
            fi
            echo "Draft release $TAG_NAME exists. Uploading/updating CLI assets..."
            gh release upload "$TAG_NAME" * --clobber
            echo "✔ Draft $TAG_NAME updated. Validate the assets, then publish manually: gh release edit $TAG_NAME --draft=false"
          else
            TARGET_COMMIT=$(git rev-parse HEAD)
            echo "Creating new GitHub Release draft for $TAG_NAME explicitly bound to commit $TARGET_COMMIT..."
            gh release create "$TAG_NAME" \
              --target "$TARGET_COMMIT" \
              --title "$TAG_NAME" \
              --notes-file release_notes.md \
              $DRAFT_FLAG \
              $PRERELEASE_FLAG \
              *
          fi
          echo "✔ GitHub Release draft updated successfully."

      - name: Report Release / Dry-Run Result
        run: |
          echo "================================================================"
          echo "✔ CI Release Flow completed successfully!"
          echo "  - Version:          v${{ needs.preflight.outputs.version }}"
          echo "  - Dry run:          ${{ needs.preflight.outputs.dry_run }}"
          echo "  - Draft mode:       ${{ needs.preflight.outputs.draft }}"
          echo "  - Platforms built:  Windows x64, Linux x64, macOS arm64, macOS x64"
          echo "  - Artifacts:        Uploaded to Actions bundle & Release"
          echo "================================================================"
