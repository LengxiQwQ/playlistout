name: Release Audit Lockfile Generator

on:
  push:
    branches: [ 'refactor/release-audit-20261006' ]
    paths:
      - 'package.json'
      - 'web/package.json'
      - 'worker/package.json'
      - '.github/workflows/release-audit-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to audit branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate lockfile for release audit"
          git push origin HEAD:refactor/release-audit-20261006

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-package-lock
          path: package-lock.json
          if-no-files-found: error
