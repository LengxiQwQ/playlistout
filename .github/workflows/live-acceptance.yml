name: Provider Live Acceptance
#
# Dedicated live acceptance testing workflow against real upstream music platforms:
# QQ Music, NetEase Cloud Music, and Kugou Music.
#
# Runs on manual trigger (workflow_dispatch) and weekly schedule.
# Kept independent of regular commit CI to avoid CI flaky failures due to external network variations.
#

on:
  workflow_dispatch:
    inputs:
      kugou_token:
        description: 'Optional Kugou user token for authenticated >300 pagination tests'
        required: false
        type: string
      kugou_userid:
        description: 'Optional Kugou user ID for authenticated >300 pagination tests'
        required: false
        type: string
      kugou_playlist_url:
        description: 'Optional Kugou playlist URL to test'
        required: false
        type: string
        default: 'https://m.kugou.com/songlist/gcid_3zr52qfrzwz02f/?src_cid=3zr52qfrzwz02f&uid=1425711902&chl=message&iszlist=1'
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC

jobs:
  live-tests:
    name: Upstream Real-Source Live Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Live Acceptance Tests
        run: npm --prefix worker run test:live
        env:
          KUGOU_TEST_TOKEN: ${{ inputs.kugou_token || secrets.KUGOU_TEST_TOKEN }}
          KUGOU_TEST_USERID: ${{ inputs.kugou_userid || secrets.KUGOU_TEST_USERID }}
          KUGOU_TEST_PLAYLIST_URL: ${{ inputs.kugou_playlist_url || secrets.KUGOU_TEST_PLAYLIST_URL }}
