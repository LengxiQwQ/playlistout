name: Provider Live Acceptance
#
# Dedicated live acceptance testing workflow against real upstream music platforms:
# QQ Music, NetEase Cloud Music, Kugou Music, and Qishui Music, plus the deployed Public API.
#
# Runs on manual trigger (workflow_dispatch) and weekly schedule.
# Kept independent of regular commit CI to avoid CI flaky failures due to external network variations.
#

on:
  push:
    branches:
      - refactor/provider-live-acceptance-20261006
  workflow_dispatch:
    inputs:
      run_kugou_authenticated_acceptance:
        description: 'Run Tier 2 Authenticated Kugou Live Acceptance (Requires GitHub Secrets: KUGOU_TEST_TOKEN, KUGOU_TEST_USERID, KUGOU_TEST_PLAYLIST_URL)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC

jobs:
  live-tests:
    name: Upstream Real-Source Live Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Tier 1 Public Provider Live Acceptance Tests
        run: npm --prefix worker run test:live

      - name: Run Production Public API Smoke
        run: npm --prefix worker run test:production:live

      - name: Run Tier 2 Kugou Authenticated Live Acceptance Tests
        if: ${{ inputs.run_kugou_authenticated_acceptance == true }}
        run: npm --prefix worker run test:live:authenticated
        env:
          RUN_KUGOU_AUTHENTICATED_ACCEPTANCE: 'true'
          KUGOU_TEST_TOKEN: ${{ secrets.KUGOU_TEST_TOKEN }}
          KUGOU_TEST_USERID: ${{ secrets.KUGOU_TEST_USERID }}
          KUGOU_TEST_PLAYLIST_URL: ${{ secrets.KUGOU_TEST_PLAYLIST_URL }}

