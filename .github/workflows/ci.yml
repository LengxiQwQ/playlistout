name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-cli:
    name: Python CLI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cli/qqmusic/requirements.txt
          pip install -r cli/netease/requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m compileall cli/qqmusic/
          python -m compileall cli/netease/

      - name: Run pytest
        run: |
          pytest -v cli/qqmusic/ cli/netease/
          python -m pytest -v scripts/utils/test_insights_authenticity.py

  web:
    name: Web Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Run unit tests
        run: npm --prefix web test

      - name: Production build
        run: npm --prefix web run build

  worker:
    name: Cloudflare Worker Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --prefix worker run typecheck

      - name: Run unit tests
        run: npm --prefix worker test

      - name: Build / dry-run
        run: npm --prefix worker run build
