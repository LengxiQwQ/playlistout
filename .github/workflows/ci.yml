name: CI

on:
  push:
    branches: [ main, 'refactor/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  repo-policy:
    name: Repository Policy Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate repository policy
        run: node scripts/ci-gate.js --policy-only

  python-cli:
    name: Python CLI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cli/qqmusic/requirements.txt
          pip install -r cli/netease/requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m compileall cli/qqmusic/
          python -m compileall cli/netease/

      - name: Run pytest
        run: |
          pytest -v cli/qqmusic/ cli/netease/
          python -m pytest -v scripts/utils/test_insights_authenticity.py

  plugins:
    name: Player Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install repository dependencies
        run: npm ci

      - name: Build, publish, and test all player plugins
        run: npm run validate:plugins

  web:
    name: Web Frontend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Run unit tests
        run: npm --prefix web test

      - name: Production build
        run: npm --prefix web run build

  worker:
    name: Cloudflare Worker Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Migration Files and Immutability
        run: node scripts/d1/validate-migrations.js

      - name: Typecheck
        run: npm --prefix worker run typecheck

      - name: Run unit tests
        run: npm --prefix worker test

      - name: Run D1 migration safety tests
        run: npm --prefix worker run test:d1

      - name: Build / dry-run
        run: npm --prefix worker run build
