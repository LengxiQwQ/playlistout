name: Deploy Worker to Cloudflare

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: playlistout-production-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Worker Typecheck & Tests
        run: |
          npm --prefix worker run typecheck
          npm --prefix worker test
          npm --prefix worker run test:d1

      - name: Check Cloudflare Credentials
        id: check-creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            if [ "${{ github.repository }}" = "LengxiQwQ/playlistout" ]; then
              echo "::error::Missing required Cloudflare deployment secrets (CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID) in main repository."
              exit 1
            else
              echo "External fork detected without secrets. Skipping deployment."
              echo "has_creds=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Cloudflare credentials verified."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify Migration Files and Baseline Immutability
        if: steps.check-creds.outputs.has_creds == 'true'
        run: node scripts/d1/validate-migrations.js

      - name: Verify Production D1 Identity
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1/verify-db.js

      - name: Preflight D1 Migration History
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1/verify-migration-history.js --remote --mode=pre-apply

      - name: Apply Pending D1 Migrations
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply playlistout-stats --remote

      - name: Postflight D1 Schema and History Completeness
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1/verify-schema.js --remote

      - name: Deploy to Cloudflare Workers
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Insights Admin Secret
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSIGHTS_ADMIN_TOKEN: ${{ secrets.INSIGHTS_ADMIN_TOKEN }}
        run: |
          if [ -n "$INSIGHTS_ADMIN_TOKEN" ]; then
            echo "$INSIGHTS_ADMIN_TOKEN" | npx wrangler secret put INSIGHTS_ADMIN_TOKEN --cwd worker
          else
            echo "INSIGHTS_ADMIN_TOKEN secret not set in repository; skipping secret configuration."
          fi
