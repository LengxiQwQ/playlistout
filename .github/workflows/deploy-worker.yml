name: Deploy Worker to Cloudflare

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Worker Typecheck & Tests
        run: |
          npm --prefix worker run typecheck
          npm --prefix worker test

      - name: Check Cloudflare Credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare credentials not found in GitHub Secrets."
            echo "To enable automated worker deployment, add CLOUDFLARE_API_TOKEN to repository Secrets."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "Cloudflare credentials found."
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Provision D1 Database and Run Migrations
        if: steps.check-creds.outputs.has_creds == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/setup-d1.js

      - name: Deploy to Cloudflare Workers
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Insights Admin Secret
        if: steps.check-creds.outputs.has_creds == 'true' && secrets.INSIGHTS_ADMIN_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSIGHTS_ADMIN_TOKEN: ${{ secrets.INSIGHTS_ADMIN_TOKEN }}
        run: |
          echo "$INSIGHTS_ADMIN_TOKEN" | npx wrangler secret put INSIGHTS_ADMIN_TOKEN --cwd worker

      - name: Commit Updated wrangler.jsonc if Changed
        if: steps.check-creds.outputs.has_creds == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain worker/wrangler.jsonc) ]]; then
            echo "wrangler.jsonc updated with real D1 UUID. Committing back to main..."
            git add worker/wrangler.jsonc
            git commit -m "chore(worker): update wrangler.jsonc with production D1 database_id [skip ci]"
            git push origin main
          else
            echo "wrangler.jsonc already up to date."
          fi
